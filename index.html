<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <h1>Tipos de Inputs</h1>
    <form action="procesa.php">
    <fieldset>
        <legend>Datos Personales</legend>
    <p>
        <label for="nom">Nombre</label>
        <input type="text" maxlength="6" name="nombre"
        id="nom">
    </p>
    <p>
        <label for="contrase">Contraseña</label>
        <input type="password" 
        maxlength="6" name="contrase"
        id="contrase">
    </p>
    <p>
<label for="hombre">Hombre:</label>
<input type="radio" value="H"
checked id="hombre" name="genero">

<label for="mujer">Mujer:</label>
<input type="radio" value="H"
checked id="mujer" name="genero">
    
     <label for="fumador">Fumador:</label>
    <input type="checkbox" name="fuma"
     id="fumador">
 </p>
     </fieldset>
<p>
    <label for="prov">Provicia:</label>
    <select name="prov" id="prov">
        <option value="cr"Ciudad Real"></option>
        <option value="ab">Albacete</option>
        <option value="gu">Guadalajara</option>
        <option value="cu">Cuenca</option>
        <option value="to">Toledo</option>
    
    </select>
    <p>
        <label for="obs">Observaciones</label>
        <textarea name="obs" id="obs"
        cols="10" rows="6"
        id="obs">
        Escriba algo..

        </textarea>
    </p>
    <p>
        <label for="color">Color</label>
        <input type="color" name="color"
        id="color">
    </p>
     <p>
        <label for="fecha-na">Fechan de Nacimiento</label>
        <input type="date" name="fecha-na"
        id="fecha-na">
    </p>
    <p>
        <label for="edad">Edad</label>
        <input type="number" name="edad"
        id="edad" min="0" max="100">
    </p>
     <p>
        <label for="email">Email</label>
        <input type="email" name="email"
        id="email" min="0" max="100">
    </p>
    <p>
        <label for="foto"> Adjuntar Foto</label>
        <input type="file" name="foto"
        id="foto" min="0" max="100">
    </p>
</p>

     <!--Botones de envio y reset-->
<p>
     <input type="submit" value="Enviar">
     <input type="reset"
     value="Reiniciar formulario">
    </p>
     </form>
    </body>
</html>
